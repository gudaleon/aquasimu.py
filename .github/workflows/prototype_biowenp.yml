name: BioWEN-P prototype tests
on:
  push:
    paths:
      - "prototypes/biowenp_py_AN_v1/**"
      - ".github/workflows/prototype_biowenp.yml"
  pull_request:
    paths:
      - "prototypes/biowenp_py_AN_v1/**"
      - ".github/workflows/prototype_biowenp.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototypes/biowenp_py_AN_v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements_AN_v1.txt
      - run: python -m pytest -q tests
