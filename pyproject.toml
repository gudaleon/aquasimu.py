[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aquasimu"
version = "0.1.0"
description = "Python port of AQUASIM (Eawag/Reichert), bioreactor-first phase: mixed and advective-diffusive reactors, mass balance, DREAM and PEST++."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "pandas>=1.5,<3",
    "numba>=0.56",
]

[project.optional-dependencies]
calib = ["pyemu>=1.3"]
plot = ["matplotlib>=3.6"]
dev = ["pytest>=7", "pyemu>=1.3", "matplotlib>=3.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "pest: needs pestpp-glm and pestpp-ies on PATH (skipped otherwise)",
    "aquasim: needs user-supplied AQUASIM listings in AQUASIMU_AQUASIM_LISTINGS (skipped otherwise)",
]
